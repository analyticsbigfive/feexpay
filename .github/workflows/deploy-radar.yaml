name: Deploy Production
on:
  push:
    branches: [main]
    paths: ["package.json"]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner (ubuntu-latest = secours si le serveur self-hosted est indisponible)"
        type: choice
        options: [self-hosted, ubuntu-latest]
        default: self-hosted

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY_URL: registry.feexpay.me
  REPOSITORY_NAME: radar-prod
  DEPLOY_PATH: /var/www/radar.feexpay.me

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || fromJSON('["self-hosted","lavedette-signoz"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Node plutôt que jq : jq n'est pas garanti sur le runner self-hosted.
      - name: Extract version from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version ?? ''")
          if [ -z "$VERSION" ]; then echo "❌ No version"; exit 1; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Moteur de scoring et migrations SQL sur PGlite, sans base externe : une image qui
      # ne passe pas ces contrôles n'est pas publiée.
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY_URL }}/${{ env.REPOSITORY_NAME }}:${{ env.VERSION }}
            ${{ env.REGISTRY_URL }}/${{ env.REPOSITORY_NAME }}:latest

      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e
            echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ env.REGISTRY_URL }} -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin
            docker pull ${{ env.REGISTRY_URL }}/${{ env.REPOSITORY_NAME }}:latest
            cd ${{ env.DEPLOY_PATH }}
            docker compose down
            docker compose up -d

      - name: Cleanup runner
        if: always()
        run: |
          docker image prune -af --filter "until=48h" || true
          docker logout ${{ env.REGISTRY_URL }} || true
